name: "♻️ Deploy to Development Namespace"

on:
  workflow_dispatch:
  push:
    branches: [main]
env:
  # A majority of the secrets generated here come from the cloud-platform-environments repository.
  KUBE_CLUSTER: ${{ secrets.KUBE_CLUSTER }}
  KUBE_NAMESPACE: ${{ secrets.DEV_KUBE_NAMESPACE }}
  KUBE_CERT: ${{ secrets.DEV_KUBE_CERT }}
  KUBE_TOKEN: ${{ secrets.DEV_KUBE_TOKEN }}

  IMAGE_TAG: ${{ github.sha }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY_URL }}
  ECR_REPOSITORY: ${{ vars.DEV_ECR_REPOSITORY }}

  FLASK_APP_SECRET: ${{ secrets.DEV_FLASK_APP_SECRET }}

  CHATBOT_API_KEY: ${{ secrets.DEV_CHATBOT_API_KEY }}
  CHATBOT_API_ID: ${{ secrets.DEV_CHATBOT_API_ID }}

  AUTH0_CLIENT_ID: ${{ secrets.DEV_AUTH0_APP_CLIENT_ID }}
  AUTH0_CLIENT_SECRET: ${{ secrets.DEV_AUTH0_APP_CLIENT_SECRET }}
  AUTH0_DOMAIN: ${{ secrets.DEV_AUTH0_DOMAIN }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component: [ui, api]
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502  # v4.0.2
        with:
          role-to-assume: ${{ secrets.DEV_ECR_ROLE_TO_ASSUME }}
          aws-region: "eu-west-2"

      - uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076  # v2.0.1
        id: login-ecr

      - if: matrix.component == 'ui'
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG-ui .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG-ui

      - if: matrix.component == 'api'
        run: |
          docker build -f Dockerfile.api -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG-api .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG-api

  deploy-to-dev:
    needs: build-push
    runs-on: ubuntu-latest
    container: alpine/k8s:1.23.17
    strategy:
      fail-fast: false
      matrix:
        component: [ui, api]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to the cluster
        run: |
          echo "${KUBE_CERT}" > ca.crt
          kubectl config set-cluster ${KUBE_CLUSTER} --certificate-authority=./ca.crt --server=https://${KUBE_CLUSTER}
          kubectl config set-credentials deploy-user --token=${KUBE_TOKEN}
          kubectl config set-context ${KUBE_CLUSTER} --cluster=${KUBE_CLUSTER} --user=deploy-user --namespace=${KUBE_NAMESPACE}
          kubectl config get-contexts
          kubectl config use-context ${KUBE_CLUSTER}

      - name: Deploy ui helm chart to dev
        if: matrix.component == 'ui'
        run: |
          helm upgrade coat-chatbot-frontend-v2\
            helm/coat-chatbot-frontend-v2 \
            --install \
            --force \
            --wait \
            --timeout 10m \
            --namespace ${KUBE_NAMESPACE} \
            --values=helm/coat-chatbot-frontend-v2/values-dev.yaml \
            --set app.deployment.env.CHATBOT_API_KEY=${CHATBOT_API_KEY} \
            --set app.deployment.env.CHATBOT_API_ID=${CHATBOT_API_ID} \
            --set app.deployment.env.APP_SECRET_KEY=${FLASK_APP_SECRET} \
            --set app.deployment.env.AUTH0_CLIENT_ID="${AUTH0_CLIENT_ID}" \
            --set app.deployment.env.AUTH0_CLIENT_SECRET="${AUTH0_CLIENT_SECRET}" \
            --set app.deployment.env.AUTH0_DOMAIN="${AUTH0_DOMAIN}" \
            --set app.deployment.image.repository=${ECR_REGISTRY}/${ECR_REPOSITORY} \
            --set app.deployment.image.tag=${IMAGE_TAG}-ui

      - name: Deploy api helm chart to dev
        if: matrix.component == 'api'
        run: |
          helm upgrade coat-chatbot-api\
            helm/coat-chatbot-api \
            --install \
            --force \
            --wait \
            --timeout 10m \
            --namespace ${KUBE_NAMESPACE} \
            --values=helm/coat-chatbot-api/values-dev.yaml \
            --set app.deployment.env.CHATBOT_API_KEY=${CHATBOT_API_KEY} \
            --set app.deployment.env.CHATBOT_API_ID=${CHATBOT_API_ID} \
            --set app.deployment.env.APP_SECRET_KEY=${FLASK_APP_SECRET} \
            --set app.deployment.image.repository=${ECR_REGISTRY}/${ECR_REPOSITORY} \
            --set app.deployment.image.tag=${IMAGE_TAG}-api
